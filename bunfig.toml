[install]
# 1 day in seconds
minimumReleaseAge = 86400
# When true, bun install will not update bun.lock. (Default false)
# If package.json and the existing bun.lock are not in agreement, this will error.
frozenLockfile = false

[test]
# Enables coverage reporting.
# Default `false`. Use `--coverage` to override.
coverage = true
coverageThreshold = 0.9

# Bun 1.4.4 owns formatting, import organization, and package.json sorting.
[fmt]
printWidth = 80
useTabs = false
tabWidth = 2
semi = true
singleQuote = false
trailingComma = "all"
sortImports = true
sortPackageJson = true
# Keep vendored skills and generated artifacts byte-for-byte unchanged.
ignorePatterns = [
  ".agents/",
  ".claude/",
  ".zed/",
  ".vscode/",
  "drizzle/",
  "worker-configuration.d.ts",
  "src/server/manifest.generated.ts",
  "public/scalar/",
  "dist/",
  "coverage/",
  ".wrangler/",
]
