[install]
# 1 day in seconds
minimumReleaseAge = 86400
# When true, bun install will not update bun.lock. (Default false)
# If package.json and the existing bun.lock are not in agreement, this will error.
frozenLockfile = false

[test]
# Coverage is opt-in through `--coverage` - see `test:coverage`. Under
# `--parallel` the denominator is wrong (README.md), so the gate stays quiet
# rather than printing a number nobody should read.
