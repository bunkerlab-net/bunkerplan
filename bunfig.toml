[install]
# 1 day in seconds
minimumReleaseAge = 86400
# When true, bun install will not update bun.lock. (Default false)
# If package.json and the existing bun.lock are not in agreement, this will error.
frozenLockfile = false

[test]
# Off by default: the accurate figure comes from `bun run test:coverage`, which
# runs one process. Under `--parallel` the denominator is wrong - see README.md -
# so the gate stays quiet rather than printing a number nobody should read.
coverage = false
