name: Check

# Reusable: lint, typecheck, and the whole test suite against every backend
# BunkerPlan ships on. Called by ci.yaml; never triggered on its own.
on:
  workflow_call:

permissions: {}

jobs:
  check:
    name: Check
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    # Service containers rather than the Docker Compose stack. Compose is how a
    # developer brings these up locally (docker-compose.test.yml); on a runner
    # the same images attach directly, so nothing has to shell out to a second
    # orchestrator and the health gates below are what the job waits on.
    #
    # RustFS attaches the same way. MinIO could not: its image needs a
    # `server /data` argument, which a service container cannot supply, so it
    # ran as a `docker run` step with a hand-written wait loop.
    #
    # Every one of these is what makes a suite run rather than skip. Without
    # them tests/drivers/* reports success having exercised only the Cloudflare
    # half, which is the failure mode this whole layout exists to avoid.
    services:
      # The Postgres repos are separate SQL from the SQLite ones. The plan
      # ceiling in particular is held by an advisory lock here, because unlike
      # SQLite this evaluates the count inside the claiming statement against a
      # snapshot - and that lock only exists against a real server.
      postgres:
        image: docker.io/postgres:18-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      # Backs KV_DRIVER=valkey, where Better Auth keeps sessions. Its default
      # command already starts the server, so no override is needed - which
      # matters, because a service container cannot supply one.
      valkey:
        image: docker.io/valkey/valkey:9-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      # Backs STORAGE_DRIVER=s3, on the release docker-compose.yml pins - keep
      # the two the same. No bucket here: tests/drivers/backends.ts creates
      # one per run and drops it. The credentials are the image defaults, and
      # a service container's `env` cannot read a runner secret anyway.
      #
      # `/health/ready` reports write quorum; `/health` only means the
      # listener is up.
      rustfs:
        image: docker.io/rustfs/rustfs:1.0.0
        env:
          RUSTFS_ACCESS_KEY: rustfsadmin
          RUSTFS_SECRET_KEY: rustfsadmin
        ports:
          - 9000:9000
        options: >-
          --health-cmd "curl -fsS http://127.0.0.1:9000/health/ready"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install: true
          cache: true
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          # `node_modules` is deliberately absent. Restoring the materialised
          # tree leaves `--frozen-lockfile` nothing to reconcile, so the
          # lockfile hashes stop gating what actually executes - including in
          # the deploy job, which runs with the Cloudflare token in its
          # environment. `~/.bun/cache` is content addressed, so a bad entry
          # fails its own integrity check instead.
          path: ~/.bun/cache
          key: ${{ runner.os }}-${{ runner.arch }}-bun-${{ hashFiles('**/bun.lock') }}
      - run: bun install --frozen-lockfile

      # `hk` is the same gate the pre-commit hook runs, so CI cannot disagree
      # with a clean local commit. It covers Biome, Pkl, package.json ordering,
      # line endings, and private keys in one pass.
      - name: Lint and format
        run: hk check --all

      # A schema change is only real once its migration is committed. Nothing
      # reconciles src/db/schema/** with drizzle/** at runtime - the tables a
      # deployment has are the ones the migrations built - so `db:generate`
      # leaving the tree clean is the evidence the two still agree. The
      # `plan_visibility_check` constraint is the sharp edge: it is generated
      # from the PLAN_VISIBILITIES tuple in src/limits.ts, where adding one
      # word rewrites SQL that has already been applied to every database.
      - name: Migrations match the schema
        run: |
          bun run db:generate
          if [ -n "$(git status --porcelain -- drizzle)" ]; then
            echo "::error::drizzle/ is stale - run 'bun run db:generate' and commit the result"
            git status --porcelain -- drizzle
            exit 1
          fi

      # Built once, here. Both steps below need `dist/` and the generated
      # asset manifest - the typecheck because that manifest is a source file,
      # the suite because it serves the real Workers bundle on Miniflare - and
      # each used to build its own, three times per run with the deploy job.
      # This is also what a separate build step always covered: a bundle that
      # does not build fails here, before anything is published.
      #
      # `bun run typecheck` and `bun run test` still build first, so the local
      # commands stay a single word. The `:only` variants are those same
      # commands with the build removed for a job that has already done it.
      - name: Build
        run: bun run build
      - name: Typecheck
        run: bun run typecheck:only

      # `bun run test:only` is `bun test --isolate`, with coverage on through
      # bunfig.toml. That is the topology that measures coverage correctly.
      #
      # Run once, on purpose. Bun's `--rerun-each` repeats every test rather
      # than retrying the failures, so it multiplies the run time of a
      # container-backed suite to hide a fault nobody has isolated - and a
      # green second attempt is the exact evidence README.md says not to
      # accept. A red run here is a thing to read, not a thing to re-roll.
      #
      # It runs against the bundle built above; `BUNKERPLAN_PREBUILT=1` in the
      # script is what tells the suite not to rebuild it.
      #
      # These variables are the opt-in. A backend whose variable is missing
      # SKIPS, so dropping one turns a conformance suite off silently - they
      # are set here precisely so that cannot happen unnoticed.
      - name: Test
        run: bun run test:only
        env:
          TEST_DATABASE_URL: postgres://ci:ci@127.0.0.1:5432/ci
          TEST_S3_ACCESS_KEY_ID: rustfsadmin
          TEST_S3_ENDPOINT: http://127.0.0.1:9000
          TEST_S3_SECRET_ACCESS_KEY: rustfsadmin
          TEST_VALKEY_URL: redis://127.0.0.1:6379
