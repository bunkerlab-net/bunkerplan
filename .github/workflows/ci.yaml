name: CI

on:
  push:
    branches:
      - master
    tags:
      - "v*"
  pull_request:
    branches:
      - master

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Superseded pull request runs are worth nothing. Pushes to master are the
  # provenance of a published tag, so they are always allowed to finish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NAMESPACE: ghcr.io/${{ github.repository_owner }}
  # Pinned for the same reason every action above is pinned to a SHA: `latest`
  # would let a Buildx release change how these images are built with no commit
  # to point at. https://github.com/docker/buildx/releases
  BUILDX_VERSION: v0.35.0

jobs:
  check:
    name: Check
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    # The Postgres repo holds its per-account plan ceiling with an advisory
    # lock, because unlike SQLite it evaluates the count inside the claiming
    # statement against a snapshot. That lock only exists against a real
    # server, so without this service `tests/plans-pg.test.ts` skips and the
    # concurrent path ships unexercised.
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4.2.3
        with:
          install: true
          cache: true
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/cache
          key: ${{ runner.os }}-${{ runner.arch }}-bun-${{ hashFiles('**/bun.lock') }}
      - run: bun install --frozen-lockfile
      # `hk` is the same gate the pre-commit hook runs, so CI cannot disagree
      # with a clean local commit. It covers Biome, Pkl, package.json ordering,
      # line endings, and private keys in one pass.
      - name: Lint and format
        run: hk check --all
      - name: Typecheck
        run: bun run typecheck
      # The end-to-end suite serves the real Workers bundle on Miniflare, so it
      # builds one first. That covers what a separate build step used to: a
      # bundle that does not build fails here, before anything is published.
      - name: Test
        run: bun test
        env:
          TEST_DATABASE_URL: postgres://ci:ci@127.0.0.1:5432/ci

  build:
    name: Build (${{ matrix.arch }})
    needs: [check]
    runs-on: ${{ matrix.runs-on }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runs-on: ubuntu-24.04
          - arch: arm64
            runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
        with:
          cache-binary: false
          version: ${{ env.BUILDX_VERSION }}
      # Pull requests build but never publish, so they need no registry write
      # and leave no per-branch images behind to garbage collect.
      - uses: docker/login-action@abd2ef45e78c5afb21d64d4ca52ee8550d9572c7 # v4.5.1
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ github.token }}

      # One tag per architecture. The real tags are applied later, when the two
      # are joined into a single index. `latest=false` keeps the flavour default
      # from quietly adding a second tag that would then race the other arch.
      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: meta-app
        with:
          images: ${{ env.NAMESPACE }}/bunkerplan
          flavor: latest=false
          tags: type=raw,value=${{ github.sha }},prefix=sha-,suffix=-${{ matrix.arch }}
          labels: |
            org.opencontainers.image.title=bunkerplan
            org.opencontainers.image.description=Standalone HTML documents at short public URLs
      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: meta-migrate
        with:
          images: ${{ env.NAMESPACE }}/bunkerplan-migrate
          flavor: latest=false
          tags: type=raw,value=${{ github.sha }},prefix=sha-,suffix=-${{ matrix.arch }}
          labels: |
            org.opencontainers.image.title=bunkerplan-migrate
            org.opencontainers.image.description=Drizzle migrations for BunkerPlan, run as a one-shot job

      # Both images come from one Dockerfile: `migrate` is the `build` stage plus
      # an entrypoint, and `runtime` copies `.output` out of it. Building them in
      # the same job means the install and the Vite build happen once.
      - name: Build app image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          target: runtime
          platforms: linux/${{ matrix.arch }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta-app.outputs.tags }}
          labels: ${{ steps.meta-app.outputs.labels }}
          annotations: ${{ steps.meta-app.outputs.annotations }}
          cache-from: type=gha,scope=docker-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=docker-${{ matrix.arch }}
      # No `cache-to` here. This build shares every expensive stage with the one
      # above, which has already exported them, and two writers on one scope
      # would just race to overwrite the same entry.
      - name: Build migration image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          target: migrate
          platforms: linux/${{ matrix.arch }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta-migrate.outputs.tags }}
          labels: ${{ steps.meta-migrate.outputs.labels }}
          annotations: ${{ steps.meta-migrate.outputs.annotations }}
          cache-from: type=gha,scope=docker-${{ matrix.arch }}

  publish:
    name: Publish ${{ matrix.image }}
    needs: [build]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: bunkerplan
            description: Standalone HTML documents at short public URLs
          - image: bunkerplan-migrate
            description: Drizzle migrations for BunkerPlan, run as a one-shot job
    steps:
      - uses: docker/login-action@abd2ef45e78c5afb21d64d4ca52ee8550d9572c7 # v4.5.1
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ github.token }}
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
        with:
          cache-binary: false
          version: ${{ env.BUILDX_VERSION }}
      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: meta
        env:
          # An image index has no config blob, so it carries annotations where a
          # single image carries labels. Emitting them at `index` level is what
          # puts the description and source on the package users actually pull.
          DOCKER_METADATA_ANNOTATIONS_LEVELS: index
        with:
          images: ${{ env.NAMESPACE }}/${{ matrix.image }}
          flavor: latest=false
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch,priority=600
            type=ref,event=branch,suffix=-{{sha}},priority=601
            type=semver,pattern={{version}}
            type=semver,pattern={{version}},suffix=-{{sha}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
          labels: |
            org.opencontainers.image.title=${{ matrix.image }}
            org.opencontainers.image.description=${{ matrix.description }}

      # The architectures were built on their own native runners, so no single
      # builder holds both. Each pushed its own suffixed tag; this gathers them
      # into one index without rebuilding or re-uploading a layer.
      #
      # `imagetools create` accepts `--tag` and `--annotation` repeatedly, so one
      # call applies every tag to one resolved index rather than re-resolving the
      # same two digests once per tag.
      - name: Create and push multi-arch manifest
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          ANNOTATIONS: ${{ steps.meta.outputs.annotations }}
          IMAGE: ${{ env.NAMESPACE }}/${{ matrix.image }}
          SHA: ${{ github.sha }}
        run: |-
          set -euo pipefail

          args=()
          while IFS= read -r tag; do
            [ -n "$tag" ] || continue
            args+=(--tag "$tag")
          done <<< "$TAGS"

          # A tagless `imagetools create` would publish an index reachable only
          # by digest, which looks like success and is useless.
          if [ ${#args[@]} -eq 0 ]; then
            echo "::error::metadata-action produced no tags"
            exit 1
          fi

          while IFS= read -r annotation; do
            [ -n "$annotation" ] || continue
            args+=(--annotation "$annotation")
          done <<< "$ANNOTATIONS"

          printf 'Tagging:\n%s\n' "$TAGS"
          docker buildx imagetools create "${args[@]}" \
            "${IMAGE}:sha-${SHA}-amd64" \
            "${IMAGE}:sha-${SHA}-arm64"

  deploy:
    name: Deploy to Cloudflare
    needs: [check]
    # Tag pushes publish images. Only master ships the Worker.
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    environment:
      name: production
      url: https://plan.bunkerlab.net
    # Serialise deploys across runs. The workflow-level group is per-ref and
    # deliberately does not cancel pushes, so two quick merges to master would
    # otherwise race to be the last writer.
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4.2.3
        with:
          install: true
          cache: true
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.bun/cache
            node_modules
          key: ${{ runner.os }}-${{ runner.arch }}-bun-${{ hashFiles('**/bun.lock') }}
      - run: bun install --frozen-lockfile

      # Schema first: the reverse order puts the new Worker in front of a table
      # it expects to exist. Wrangler skips its confirmation when it detects CI,
      # captures a backup, and rolls a failed migration back to the previous one.
      - name: Apply D1 migrations
        run: bun wrangler d1 migrations apply bunkerplan --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # `bun run deploy` is the path a local deploy already takes: refuse the
      # dev placeholders, build, then deploy the generated config rather than
      # wrangler.jsonc. Calling wrangler directly here would be a second
      # mechanism, free to drift from the one people run by hand.
      - name: Deploy Worker
        run: bun run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
