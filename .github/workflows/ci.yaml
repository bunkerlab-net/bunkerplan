name: CI

# Orchestration only. Every job below is one `uses:` into a reusable workflow
# in this directory, so this file holds the graph - what runs, in what order,
# under what condition - and nothing else. The steps live next to the concern
# they belong to:
#
#   check.yaml   lint, typecheck, and the suite against every backend
#   docker.yaml  both images per architecture, then the multi-arch index
#   deploy.yaml  D1 migrations, then the Worker
#
# Reusable workflows do not inherit `env`, so anything shared has to be passed
# as an input.
on:
  push:
    branches:
      - master
    tags:
      - "v*"
  pull_request:
    branches:
      - master

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Superseded pull request runs are worth nothing. Pushes to master are the
  # provenance of a published tag, so they are always allowed to finish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Check
    uses: ./.github/workflows/check.yaml
    permissions:
      contents: read

  docker:
    name: Docker
    needs: [check]
    uses: ./.github/workflows/docker.yaml
    permissions:
      contents: read
      packages: write
    with:
      # Pull requests build both images but publish neither.
      push: ${{ github.event_name != 'pull_request' }}
      # https://github.com/docker/buildx/releases
      buildx-version: v0.35.0

  deploy:
    name: Deploy
    needs: [check]
    # Tag pushes publish images. Only master ships the Worker.
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    uses: ./.github/workflows/deploy.yaml
    permissions:
      contents: read
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
