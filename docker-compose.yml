# Exercises every non-Cloudflare driver at once: Postgres + Valkey + RustFS.
# Passing here means the same code that runs on Workers also runs self-hosted.
services:
  postgres:
    image: docker.io/postgres:18-alpine
    environment:
      POSTGRES_USER: bunkerplan
      POSTGRES_PASSWORD: bunkerplan
      POSTGRES_DB: bunkerplan
    volumes:
      # Postgres 18+ images want a single mount at /var/lib/postgresql and
      # place the cluster in a major-version subdirectory beneath it.
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bunkerplan -d bunkerplan"]
      interval: 5s
      timeout: 5s
      retries: 10

  valkey:
    image: docker.io/valkey/valkey:9-alpine
    command: ["valkey-server", "--save", "60", "1"]
    volumes:
      - valkey-data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  rustfs:
    # Pinned like postgres and valkey above. Keep this tag and the one in
    # .github/workflows/check.yaml on the same release.
    image: docker.io/rustfs/rustfs:1.0.0
    # No command: the image starts the server and defaults RUSTFS_VOLUMES
    # to /data.
    environment:
      RUSTFS_ACCESS_KEY: rustfsadmin
      RUSTFS_SECRET_KEY: rustfsadmin
      # Console on http://localhost:9001/rustfs/console/
      RUSTFS_CONSOLE_ENABLE: "true"
    ports:
      - "9001:9001"
    volumes:
      - rustfs-data:/data
    healthcheck:
      # `/health/ready`, not `/health`: it reports write quorum, so
      # rustfs-init cannot create a bucket before the server can store one.
      # `curl` is in the image.
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/health/ready"]
      interval: 5s
      timeout: 5s
      retries: 10

  rustfs-init:
    # `rc` is RustFS's client and versions separately from the server.
    image: docker.io/rustfs/rc:v0.1.36
    depends_on:
      rustfs:
        condition: service_healthy
    # The entrypoint is `rc` itself, so two commands need a shell. `-e` stops
    # the run if the alias fails.
    entrypoint: /bin/sh
    command:
      - -ec
      - |-
        rc alias set local http://rustfs:9000 rustfsadmin rustfsadmin
        rc bucket create --ignore-existing local/bunkerplan

  migrate:
    build:
      context: .
      target: migrate
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://bunkerplan:bunkerplan@postgres:5432/bunkerplan

  app:
    build: .
    depends_on:
      migrate:
        condition: service_completed_successfully
      valkey:
        condition: service_healthy
      rustfs-init:
        condition: service_completed_successfully
    ports:
      - "3000:3000"
    environment:
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?set BETTER_AUTH_SECRET in .env}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:3000}
      # Required off Workers. This stack has no reverse proxy in front, so
      # nothing overwrites the header and the value here is only good enough
      # for local development. Behind a real proxy, set CLIENT_IP_HEADER to
      # the one header that proxy OVERWRITES, or every caller shares one auth
      # rate-limit bucket - see docs/self-hosting.md.
      CLIENT_IP_HEADER: ${CLIENT_IP_HEADER:-x-forwarded-for}
      DB_DRIVER: postgres
      DATABASE_URL: postgres://bunkerplan:bunkerplan@postgres:5432/bunkerplan
      KV_DRIVER: valkey
      VALKEY_URL: redis://valkey:6379
      STORAGE_DRIVER: s3
      S3_BUCKET: bunkerplan
      S3_ENDPOINT: http://rustfs:9000
      S3_REGION: us-east-1
      S3_FORCE_PATH_STYLE: "true"
      # RustFS has no credential provider chain, so explicit keys are correct
      # HERE ONLY. A real AWS deployment MUST omit S3_ACCESS_KEY_ID,
      # S3_SECRET_ACCESS_KEY, and S3_ENDPOINT and attach an IAM role instead -
      # the SDK then resolves and rotates credentials automatically.
      S3_ACCESS_KEY_ID: rustfsadmin
      S3_SECRET_ACCESS_KEY: rustfsadmin

volumes:
  postgres-data:
  valkey-data:
  rustfs-data:
