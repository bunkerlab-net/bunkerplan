# Exercises every non-Cloudflare driver at once: Postgres + Valkey + MinIO.
# Passing here means the same code that runs on Workers also runs self-hosted.
services:
  postgres:
    image: docker.io/postgres:18-alpine
    environment:
      POSTGRES_USER: bunkerplan
      POSTGRES_PASSWORD: bunkerplan
      POSTGRES_DB: bunkerplan
    volumes:
      # Postgres 18+ images want a single mount at /var/lib/postgresql and
      # place the cluster in a major-version subdirectory beneath it.
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bunkerplan -d bunkerplan"]
      interval: 5s
      timeout: 5s
      retries: 10

  valkey:
    image: docker.io/valkey/valkey:9-alpine
    command: ["valkey-server", "--save", "60", "1"]
    volumes:
      - valkey-data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    # Pinned like postgres and valkey above. MinIO publishes no moving
    # major-version tag, only dated releases, so this is the tag to bump.
    image: docker.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio-init:
    image: docker.io/minio/mc
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb --ignore-existing local/bunkerplan
      "

  migrate:
    build:
      context: .
      target: migrate
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://bunkerplan:bunkerplan@postgres:5432/bunkerplan

  app:
    build: .
    depends_on:
      migrate:
        condition: service_completed_successfully
      valkey:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    ports:
      - "3000:3000"
    environment:
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?set BETTER_AUTH_SECRET in .env}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:3000}
      # Required off Workers. This stack has no reverse proxy in front, so
      # nothing overwrites the header and the value here is only good enough
      # for local development. Behind a real proxy, set CLIENT_IP_HEADER to
      # the one header that proxy OVERWRITES, or every caller shares one auth
      # rate-limit bucket - see docs/self-hosting.md.
      CLIENT_IP_HEADER: ${CLIENT_IP_HEADER:-x-forwarded-for}
      DB_DRIVER: postgres
      DATABASE_URL: postgres://bunkerplan:bunkerplan@postgres:5432/bunkerplan
      KV_DRIVER: valkey
      VALKEY_URL: redis://valkey:6379
      STORAGE_DRIVER: s3
      S3_BUCKET: bunkerplan
      S3_ENDPOINT: http://minio:9000
      S3_REGION: us-east-1
      S3_FORCE_PATH_STYLE: "true"
      # MinIO has no credential provider chain, so explicit keys are correct
      # HERE ONLY. A real AWS deployment MUST omit S3_ACCESS_KEY_ID,
      # S3_SECRET_ACCESS_KEY, and S3_ENDPOINT and attach an IAM role instead -
      # the SDK then resolves and rotates credentials automatically.
      S3_ACCESS_KEY_ID: minioadmin
      S3_SECRET_ACCESS_KEY: minioadmin

volumes:
  postgres-data:
  valkey-data:
  minio-data:
